---
# cPanel Git Version Control deployment script - runs when you click "Deploy
# HEAD Commit" on this repo in cPanel. Builds the Vite frontend from source
# and copies the output into public_html - .env is never part of this repo
# (gitignored from the start), so this can never touch/overwrite it, unlike
# the manual zip uploads this replaces for the frontend.
#
# Only covers the frontend - app-data-server/, user-admin-server/,
# whatsapp-server/, and mpesa-server/ are deliberately excluded from git
# (they hold real secrets) and still need their own manual zip deploys.
#
# Everything below is captured into ~/deploy.log (viewable directly in File
# Manager) since cPanel's own UI doesn't surface task output anywhere -
# without this we're deploying blind.
deployment:
  tasks:
    - . /home/fjwkkmge/nodevenv/data.bgoshinehub.co.ke/app-data-server/20/bin/activate && cd /home/fjwkkmge/repositories/carwash && (echo "=== $(date) ==="; which node; which npm; node -v; npm -v; npm install && npm run build && cp -R dist/. /home/fjwkkmge/public_html/ && echo DEPLOY_OK || echo DEPLOY_FAILED) > /home/fjwkkmge/deploy.log 2>&1
